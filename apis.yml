apis:
- aid: ccc-intelligent-solutions:ccc-secure-share-api
  name: CCC Secure Share API
  description: CCC's only publicly named API product. Secure Share is described by CCC
    as "a network using cloud-based APIs to permit more than 22,000 collision repairers
    to connect to apps using the CIECA BMS data standard", replacing the legacy EMS
    local-file "data pump" model with a "RESTful cloud service API, JSON/XML". It moves
    collision assignment, estimate, final bill and part price change messages between
    CCC ONE Estimating licensees and registered third-party applications. No public
    API reference, no OpenAPI and no documented base URL are published - the app
    developer dashboard, "full API documentation including samples and technical
    documentation", is released only after registration, CCC review of the application,
    and active CIECA membership. The live API host api.cccsecureshare.com returns 404
    on every unauthenticated discovery path, so the base URL below is observed rather
    than documented by CCC.
  humanURL: https://www.cccsecureshare.com/Developers
  baseURL: https://api.cccsecureshare.com
  tags:
  - Claims
  - Collision Repair
  - CIECA BMS
  - Partner Gated
  properties:
  - type: Documentation
    url: https://www.cccsecureshare.com/Developers
  - type: Documentation
    url: https://www.cccsecureshare.com/Faq
  - type: SignUp
    url: https://www.cccsecureshare.com/Register
  - type: Login
    url: https://www.cccsecureshare.com/Login
  - type: Conventions
    url: conventions/ccc-intelligent-solutions-conventions.yml
- aid: ccc-intelligent-solutions:ccc-platform-api
  name: CCC Platform API Gateway
  description: CCC's production API gateway. GET https://api.cccis.com/v1 returns HTTP
    401 with an RFC 6750 Bearer challenge and an Apigee fault body
    ({"fault":{"faultstring":"Invalid access token","detail":{"errorcode":"oauth.v2.InvalidAccessToken"}}}),
    confirming a real, substantial API estate behind an OAuth 2.0 gateway (Apigee
    behind Cloudflare). CCC documents nothing about it publicly - no reference, no
    OpenAPI, no token issuance path, no scopes, no rate-limit signalling. Access is
    contractual, negotiated through the Master Service Agreement rather than through
    a developer portal. Recorded here because the surface is live and verifiable, not
    because CCC advertises it.
  humanURL: https://docs.cccis.com/insurers/documentation
  baseURL: https://api.cccis.com
  tags:
  - Claims
  - API Gateway
  - OAuth
  - Partner Gated
  properties:
  - type: Authentication
    url: authentication/ccc-intelligent-solutions-authentication.yml
  - type: ErrorCatalog
    url: errors/ccc-intelligent-solutions-problem-types.yml
  - type: Conventions
    url: conventions/ccc-intelligent-solutions-conventions.yml
- aid: ccc-intelligent-solutions:ccc-identity-oidc
  name: CCC Identity (OpenID Connect)
  description: The Okta-hosted identity service behind CCC Connect and the CCC customer
    and partner portals, running on the custom domain auth.cccis.com
    (cccis.customdomains.okta.com). This is the only CCC surface that serves
    machine-readable discovery anonymously - an OpenID Connect Discovery 1.0 document
    and an RFC 8414 authorization-server metadata document at the org level, plus a
    second discovery document for the custom authorization server used by CCC Connect.
    Supports authorization code with PKCE (S256), implicit, password, refresh token
    and device code grants, token introspection and revocation, and advertises DPoP
    signing algorithms. connect.cccis.com issues an authorization-code + PKCE request
    with scope "openid email profile connect:portal". No public or dynamic client
    registration is offered to third parties.
  humanURL: https://connect.cccis.com/
  baseURL: https://auth.cccis.com
  tags:
  - Identity
  - OAuth
  - OpenID Connect
  - Okta
  properties:
  - type: OpenIDConnect
    url: https://auth.cccis.com/.well-known/openid-configuration
  - type: Authentication
    url: authentication/ccc-intelligent-solutions-authentication.yml
  - type: OAuthScopes
    url: scopes/ccc-intelligent-solutions-scopes.yml
  - type: WellKnown
    url: well-known/ccc-intelligent-solutions-well-known.yml
