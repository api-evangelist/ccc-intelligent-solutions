name: CCC Intelligent Solutions
kind: company
description: CCC Intelligent Solutions (CCCIS, NASDAQ CCCS) is a Chicago-headquartered
  cloud software company that sits between US property and casualty insurance carriers
  and the auto claims economy. Its IX Cloud platform and CCC ONE estimating products
  run auto physical damage estimating, total-loss valuation, reinspection, subrogation,
  first- and third-party casualty medical bill review, parts procurement, and claim
  payments across tens of thousands of insurers, collision repair facilities, automakers,
  parts suppliers and lenders. CCC is a claims-technology intermediary rather than a
  risk carrier, and it is one of the software layers that accumulated value in a US
  market with no federal insurance regulator and no open-insurance mandate. Its API
  posture is honest to that seam and is entirely partner-gated - there is no public,
  self-serve developer portal, no downloadable OpenAPI, and no public API reference.
  The production gateway at api.cccis.com is live but answers unauthenticated calls
  with an OAuth 2.0 bearer token fault, portal access runs through an Okta-hosted
  OAuth 2.0 authorization-code flow at auth.cccis.com, and the one named public API
  product - CCC Secure Share - publishes only a marketing developer page whose
  documentation, samples and dashboard require registration, CCC approval and active
  CIECA membership. CCC's data-standards posture is CIECA (BMS/EMS) rather than ACORD.
